<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- White circular background -->
  <circle cx="50" cy="50" r="50" fill="#ffffff" />
  
  <!-- AlgoMásQueLuz Sun Logo Vector -->
  <g stroke="#fab216" stroke-width="8" stroke-linecap="round">
    <!-- Top ray (medium) -->
    <line x1="50" y1="36" x2="50" y2="16" />
    
    <!-- Top-Right ray (medium diagonal) -->
    <line x1="60" y1="40" x2="74" y2="26" />
    
    <!-- Right ray (short horizontal) -->
    <line x1="64" y1="50" x2="74" y2="50" />
    
    <!-- Bottom-Right ray (medium diagonal) -->
    <line x1="60" y1="60" x2="74" y2="74" />
    
    <!-- Bottom ray (long vertical) -->
    <line x1="50" y1="64" x2="50" y2="88" />
    
    <!-- Bottom-Left ray (medium diagonal) -->
    <line x1="40" y1="60" x2="26" y2="74" />
    
    <!-- Left ray (short horizontal) -->
    <line x1="36" y1="50" x2="26" y2="50" />
    
    <!-- Top-Left ray (medium diagonal) -->
    <line x1="40" y1="40" x2="26" y2="26" />
  </g>
</svg>
